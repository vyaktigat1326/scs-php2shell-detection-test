# DRAFT for human review. Submits the PHP2Shell artifact fixtures to SCS Dev
# artifact scanning (Billy CLI -> billy-server -> manifest-service), mirroring
# argonsecurity/billy-e2e .github/workflows/generate-manifest.yml ("Download Billy
# Dev" + "Generate Manifest"). Billy rejects localhost runs, so it has to run in CI.
# Credentials come from repository secrets by reference only.
name: billy-artifact-scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  billy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        artifact:
          - artifacts/debian13-php8.4.24-vulnerable/rootfs
          - artifacts/debian13-php8.4.27-patched/rootfs
          - artifacts/standalone-php8.4.26-vulnerable/runtime
          - artifacts/standalone-php8.4.27-patched/runtime
    env:
      # Dev values from billy/client/pkg/http/http.go (billyServerToAquaServerMap)
      # and trivy-commercial pkg/commands/consts.go (DEV_CSPM_URL).
      BILLY_SERVER: https://billy.dev-aqua.codesec.aquasec.com
      AQUA_URL: https://api.dev.supply-chain.cloud.aquasec.com
      CSPM_URL: https://stage.api.cloudsploit.com
      AQUA_KEY: ${{ secrets.AQUA_KEY_DEV }}
      AQUA_SECRET: ${{ secrets.AQUA_SECRET_DEV }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify fixture checksums
        run: cd "$(dirname "${{ matrix.artifact }}")" && sha256sum -c SHA256SUMS --quiet

      - name: Download Billy Dev
        run: |
          curl -sLo install.sh download.dev-aqua.codesec.aquasec.com/billy/install.sh
          BINDIR="." DEBUG="true" sh install.sh ${{ github.token }}

      - name: Generate manifest
        id: generate
        run: |
          name="$(basename "$(dirname "${{ matrix.artifact }}")")"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ./billy generate \
            --access-token "${{ github.token }}" \
            --cspm-url "$CSPM_URL" \
            --artifact-path "${{ matrix.artifact }}" \
            --sbom-file-path "sbom-$name.cdx.json" \
            --output "manifest-$name.json" \
            --skip-policy-exit-code

      - name: Summarize
        if: always()
        run: |
          name="${{ steps.generate.outputs.name }}"
          m="manifest-$name.json"; s="sbom-$name.cdx.json"
          [ -f "$m" ] || { echo "no manifest written"; exit 1; }
          {
            echo "### $name"
            echo "- manifest id (artifact scan ID): \`$(jq -r .id "$m")\`"
            echo "- artifact: \`$(jq -r '.artifact.type + " " + .artifact.name + "@" + .artifact.version' "$m")\`"
            echo "- SBOM components: $(jq '.components | length' "$s")"
            echo "- SBOM vulnerabilities: $(jq '.vulnerabilities | length' "$s")"
            echo "- PHP2Shell: $(jq -r '[.vulnerabilities[]? | select(.id | test("CVE-2026-10961[89]")) | .id] | unique | join(", ") | if . == "" then "none" else . end' "$s")"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: billy-${{ steps.generate.outputs.name }}
          path: |
            manifest-*.json
            sbom-*.cdx.json
